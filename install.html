<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新汤米素材助手</title><meta name="referrer" content="origin"><style>

</style></head><body><main class="card"><h1>汤米素材助手</h1><p id="status">正在准备安装…</p><a id="install" class="button" hidden>安装更新</a><p class="small">如 Firefox 出现“允许安装”或更新确认，请按提示确认。此操作会保留现有插件记录。</p><p class="small"><a href="https://github.com/qq1395970680-source/tommy-material-helper-updates/releases">查看所有版本</a></p></main><script>

const version = new URL(location.href).searchParams.get("version") || "";
